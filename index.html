<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>A Invasão</title>
  <meta name="theme-color" content="#0e0d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="A Invasão">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block" rel="stylesheet">
  <link rel="stylesheet" href="src/estilo.css">
</head>
<body>
  <div id="jogo"></div>
  <div id="girar">Gire o aparelho<br>para jogar</div>
  <div id="aviso">CARREGANDO...</div>
  <script>
    // Mostra qualquer erro na tela (ajuda a testar no iPhone, sem console).
    function mostrarErro(msg) {
      var el = document.getElementById('aviso');
      el.style.display = 'block';
      el.className = 'erro';
      el.textContent += '\n' + msg;
    }
    window.addEventListener('error', function (e) {
      var pilha = e.error && e.error.stack ? '\n' + String(e.error.stack).split('\n').slice(0, 4).join('\n') : '';
      mostrarErro('ERRO: ' + e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '') + pilha);
    });
    window.addEventListener('unhandledrejection', function (e) {
      mostrarErro('ERRO: ' + (e.reason && e.reason.message || e.reason));
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js" crossorigin="anonymous"></script>
  <script>
    if (!window.Phaser) mostrarErro('Phaser não carregou da CDN (jsdelivr).');
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
